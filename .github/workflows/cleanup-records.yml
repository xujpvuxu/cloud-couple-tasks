name: Retain task history for seven days
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Remind to configure credentials
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT == '' }}
        run: echo "Set the FIREBASE_SERVICE_ACCOUNT repository secret to enable automatic cleanup."
      - uses: actions/checkout@v4
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
      - uses: actions/setup-node@v4
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
      - uses: google-github-actions/auth@v2
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        with:
          credentials_json: ${{ env.FIREBASE_SERVICE_ACCOUNT }}
      - run: npm run cleanup:records
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        env:
          FIREBASE_PROJECT_ID: cloud-couple-tasks
